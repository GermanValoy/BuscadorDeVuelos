name: Alerta de vuelos baratos

on:
  schedule:
    - cron: "17 11 * * *" # una vez por dia (08:17 hora Argentina)
  workflow_dispatch:
    inputs:
      mail_prueba:
        description: "Enviar mail de prueba aunque no haya ofertas"
        type: boolean
        default: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python buscador.py ${{ inputs.mail_prueba && '--mail-prueba' || '' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
