name: Alerta de vuelos baratos

on:
  schedule:
    - cron: "17 11 * * *" # todos los dias (08:17 hora Argentina)
  workflow_dispatch:
    inputs:
      mail_prueba:
        description: "Enviar mail de prueba aunque no haya ofertas"
        type: boolean
        default: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Precios de cada tramo guardados entre corridas.
      - uses: actions/cache@v5
        with:
          path: precios.json
          key: precios-${{ github.run_id }}
          restore-keys: precios-
      - run: python buscador.py ${{ inputs.mail_prueba && '--mail-prueba' || '' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
